; Deployed by 5-dotfiles.sh -- unconditionally, on every redeploy, unlike
; most of this repo's other dotfiles. That's safe here specifically
; because of use_xdg_state below: it moves waypaper's *live* state (which
; wallpaper/folder/monitor you last picked) out of this file and into
; ~/.local/state/waypaper/state.ini, so re-deploying this file can never
; wipe your current wallpaper selection.
;
; backend=awww: waypaper is a GUI picker, awww is what actually renders
; the wallpaper (installed in stage 2, official repo -- renamed from
; 'swww' in October 2025). folder points at the same directory theme.sh
; drops bundled theme wallpapers (e.g. Tokyo Night) into, so they show up
; in waypaper's picker too. post_command re-themes the desktop via Matugen
; every time you pick a new wallpaper -- unconditionally, even if a
; curated theme.sh theme (e.g. Tokyo Night) is currently active; see the
; README's theme switching section for why that's intentional -- see the
; README's color theming section for the Matugen pipeline itself. It also
; refreshes the wallpaper crops a couple of rofi layouts read from
; ~/.cache/hyde/ (see dotfiles/rofi/gen-wallcache.sh).
[Settings]
backend = awww
folder = ~/Pictures/wallpapers
use_xdg_state = true
post_command = matugen image "$wallpaper" && ~/.config/rofi/gen-wallcache.sh "$wallpaper"
