; Deployed by 5-dotfiles.sh. Makes Qt6 apps (kate, pavucontrol, ...) actually
; pick up a theme instead of rendering with Qt's unstyled default -- paired
; with `env = QT_QPA_PLATFORMTHEME,qt6ct` in hyprland.conf, which is what
; tells Qt apps to consult this file at all.
;
; style=gtk3, not a Qt-native style + a static color scheme (mylinuxforwork/
; dotfiles' own qt6ct.conf hardcodes style=Breeze + darker.conf, both
; KDE-Breeze-specific -- this repo doesn't install Breeze or any KDE color
; scheme). qt6ct's "gtk3" platform style instead forwards Qt widget
; rendering through the GTK3 theme engine, so Qt apps track whichever GTK
; theme is currently active -- the same one theme.sh/gsettings already set
; in ~/.config/gtk-3.0/gtk-4.0/settings.ini -- with no separate Qt palette
; to keep in sync across theme switches or Matugen wallpaper changes.
;
; icon_theme is kept current by theme.sh (set_kv patches this line the same
; way it patches gtk-3.0/gtk-4.0/settings.ini's gtk-icon-theme-name and
; rofi's config.rasi icon-theme -- see theme.sh's apply_gtk_icon_cursor()).
[Appearance]
custom_palette=false
icon_theme=__ICON_THEME__
standard_dialogs=gtk3
style=gtk3

[Interface]
activate_item_on_single_click=1
buttonbox_layout=0
cursor_flash_time=1000
dialog_buttons_have_icons=1
double_click_interval=400
gui_effects=@Invalid()
keyboard_scheme=2
menus_have_icons=true
show_shortcuts_in_context_menus=true
stylesheets=@Invalid()
toolbutton_style=4
underline_shortcut=1
wheel_scroll_lines=3

[Troubleshooting]
force_raster_widgets=1
ignored_applications=@Invalid()
