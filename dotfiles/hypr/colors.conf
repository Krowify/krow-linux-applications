# Deployed by 5-dotfiles.sh, then kept up to date by theme.sh -- see the
# README's theme switching section. This file also gets overwritten
# in-place by Matugen once you pick a wallpaper via waypaper -- see the
# README's color theming section. Sourced from hyprland.conf. Shipped
# values here match the default theme (Tokyo Night), so a fresh deploy
# still looks right even before theme.sh ever runs.

$colActiveBorder1 = rgba(bb9af7ff)
$colActiveBorder2 = rgba(b4f9f8ff)
$colInactiveBorder1 = rgba(565f89cc)
$colInactiveBorder2 = rgba(9aa5cecc)
