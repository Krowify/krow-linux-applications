# Deployed by theme.sh into ~/.config/hypr/colors.conf. Graphite Mono
# palette -- ported from HyDE-Project/hyde-themes' own hypr.theme
# (Graphite-Mono branch), replacing this repo's earlier unverified
# approximation. Not touched by Matugen: picking a new wallpaper via
# waypaper still re-themes everything dynamically (that's unchanged),
# but theme.sh itself sets these directly rather than deriving them from
# a wallpaper.

$colActiveBorder1 = rgba(d9d9d9ff)
$colActiveBorder2 = rgba(a6a6a6ff)
$colInactiveBorder1 = rgba(404040cc)
$colInactiveBorder2 = rgba(262626cc)
