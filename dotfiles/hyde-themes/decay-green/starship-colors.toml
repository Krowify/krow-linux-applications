# Deployed by theme.sh into ~/.config/starship.toml. Starship's config
# has no @import either (same limitation as fastfetch, see
# fastfetch-colors.jsonc's header), so this is the theme's *entire*
# prompt config, not just a colors partial -- theme.sh replaces the
# whole file on every switch. Same modules/format across all three
# themes; only the [palettes.*] table (and the `palette =` line
# selecting it) differ, using each theme's real accent colors -- every
# `style = "bg:peach fg:crust"`-style reference elsewhere in the file
# stays untouched, since it's just looking up these palette keys by name.
"$schema" = 'https://starship.rs/config-schema.json'

format = """
[╭─](fg:surface2)\
[](fg:surface1)\
$os\
[](bg:peach fg:surface1)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$c$rust$golang$nodejs$php$java$kotlin$haskell$python\
[](fg:green bg:sapphire)\
$conda\
[](fg:sapphire bg:lavender)\
$time\
[](fg:lavender)\
$line_break\
[╰─](fg:surface2)\
$character"""

palette = 'decay_green'

[os]
disabled = false
style = "bg:surface1 fg:text"

[os.symbols]
Arch = "   "
Linux = " 󰌽  "

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 0

[directory.substitutions]
"~" = " "

[git_branch]
symbol = " "
style = "bg:yellow fg:crust"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:yellow fg:crust"
format = '[($all_status$ahead_behind )]($style)'

[nodejs]
symbol = " "
style = "bg:green"
format = '[[ $symbol](fg:crust bg:green)]($style)'

[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol](fg:crust bg:green)]($style)'

[rust]
symbol = " "
style = "bg:green"
format = '[[ $symbol](fg:crust bg:green)]($style)'

[golang]
symbol = "󰟓 "
style = "bg:green"
format = '[[ $symbol](fg:crust bg:green)]($style)'

[php]
symbol = " "
style = "bg:green"
format = '[[ $symbol](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol](fg:crust bg:green)]($style)'

[kotlin]
symbol = " "
style = "bg:green"
format = '[[ $symbol](fg:crust bg:green)]($style)'

[haskell]
symbol = " "
style = "bg:green"
format = '[[ $symbol](fg:crust bg:green)]($style)'

[python]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[conda]
symbol = " "
style = "bg:sapphire"
format = '[[ $symbol( $environment) ](fg:crust bg:sapphire)]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'

# red isn't a Decay Green accent (this theme has no native red at all --
# just green/gold/blue, see hypr-colors.conf/rofi-colors.rasi) -- kept as
# a legible desaturated coral so [character]'s error state and git's
# ahead/behind indicators still read clearly, rather than forcing an
# off-theme color choice just to have "a red".
[palettes.decay_green]
red = "#e08787"
peach = "#95d3af"
yellow = "#ecd3a0"
green = "#90ceaa"
sapphire = "#86aaec"
lavender = "#98d3ee"
crust = "#0d0f18"
surface2 = "#1c2130"
surface1 = "#141821"
surface0 = "#0d0f18"
text = "#a5b6cf"
