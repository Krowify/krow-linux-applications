# Matugen template -- input for [templates.hyprland] in config.toml.
# Generates ~/.config/hypr/colors.conf from the current wallpaper.
# hyprland.conf's col.active_border/col.inactive_border are both two-stop
# gradients (general { } block), so all four of these need to exist --
# colInactiveBorder2 was missing here (present in every theme.sh curated
# theme's hypr-colors.conf, just never added to this template), which
# left Hyprland unable to parse col.inactive_border's gradient at all
# after picking a wallpaper through waypaper.
#
# colInactiveBorder1, not colInactiveBorder -- Hyprland's $variable
# substitution isn't word-boundary aware, so a bare "colInactiveBorder"
# is a literal text prefix of "colInactiveBorder2" and gets matched
# first, leaving a stray "2" in the output (e.g. "rgba(4b454daa)2 45deg",
# "failed to parse ... as a color"). colActiveBorder1/2 never hit this
# because neither name is a prefix of the other.
$colActiveBorder1 = rgba({{colors.primary.default.hex_stripped}}ee)
$colActiveBorder2 = rgba({{colors.secondary.default.hex_stripped}}ee)
$colInactiveBorder1 = rgba({{colors.surface_variant.default.hex_stripped}}aa)
$colInactiveBorder2 = rgba({{colors.outline_variant.default.hex_stripped}}aa)
