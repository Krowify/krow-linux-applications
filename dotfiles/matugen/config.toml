# Deployed by 5-dotfiles.sh. Run manually with `matugen image /path/to/wallpaper`,
# or automatically whenever you pick a new one -- waypaper's config.ini
# (dotfiles/waypaper/config.ini) is set to call this on every wallpaper
# change. See the README's color theming section.
#
# Best-effort config, not verified against a live matugen install -- if a
# template fails or a color role name doesn't exist in your matugen
# version, check `matugen image <path> --dry-run` output and adjust the
# role names below/in templates/*.

[config]
mode = "dark"

# post_hook makes each app actually pick up the regenerated file --
# writing colors.conf/css alone doesn't make a running app re-read it.
# Alacritty isn't listed here since it live-reloads its config on file
# change by itself.

[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"
post_hook = "hyprctl reload"

[templates.waybar]
input_path = "~/.config/matugen/templates/waybar-colors.css"
output_path = "~/.config/waybar/tokens/colors.css"
post_hook = "killall -SIGUSR2 waybar"

[templates.swaync]
input_path = "~/.config/matugen/templates/swaync-variables.css"
output_path = "~/.config/swaync/tokens/variables.css"
post_hook = "swaync-client -rs"

[templates.alacritty]
input_path = "~/.config/matugen/templates/alacritty-colors.toml"
output_path = "~/.config/alacritty/colors.toml"

# No post_hook -- wlogout is launched fresh each time (Super+Escape), not
# a running daemon, so there's nothing to signal; it just picks up the
# regenerated file on its next launch.
[templates.wlogout]
input_path = "~/.config/matugen/templates/wlogout-colors.css"
output_path = "~/.config/wlogout/colors.css"

[templates.eww]
input_path = "~/.config/matugen/templates/eww-colors.scss"
output_path = "~/.config/eww/colors.scss"
post_hook = "eww reload"

# Same no-post_hook reasoning as wlogout -- rofi is launched fresh per
# invocation, not a running daemon.
[templates.rofi]
input_path = "~/.config/matugen/templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors.rasi"

# Quickshell dock (dotfiles/quickshell-dock/) -- a running daemon like
# waybar, but its color source is read at runtime via an IPC call rather
# than a file the process watches, so the post_hook calls that instead of
# killing/restarting anything.
[templates.quickshell-dock]
input_path = "~/.config/matugen/templates/quickshell-dock-colors.json"
output_path = "~/.config/ml4w/colors/colors.json"
post_hook = "qs ipc -c dock call theme-manager reload"

# Quickshell workspace overview (dotfiles/quickshell-overview/) -- also a
# running daemon (exec-once'd, toggled via IPC rather than launched fresh
# per invocation), but unlike the dock its colors are plain QML property
# values compiled into the component tree at process start, not something
# it re-reads at runtime -- there's no IPC call that makes a running
# instance pick up a new Appearance.colors.qml. No post_hook here on
# purpose: a new palette takes effect on the next `qs -c overview` restart
# (next login, or manually: `pkill -f "qs -c overview"; qs -c overview &`).
[templates.quickshell-overview]
input_path = "~/.config/matugen/templates/quickshell-overview-colors.qml"
output_path = "~/.config/quickshell/overview/common/Appearance.colors.qml"
