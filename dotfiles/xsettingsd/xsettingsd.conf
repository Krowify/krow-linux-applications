# Deployed by 5-dotfiles.sh, kept current by theme.sh (see
# apply_gtk_icon_cursor()). Propagates theme/icon/cursor settings via the
# XSETTINGS protocol -- mainly read by GTK2 and Xwayland/X11 clients that
# don't pick up ~/.config/gtk-3.0/gtk-4.0/settings.ini directly the way
# native GTK3/4 apps do. Launched via `exec-once = xsettingsd` in
# hyprland.conf; reloads in place on SIGHUP rather than needing a restart.
#
# __GTK_THEME__/__ICON_THEME__/__CURSOR_THEME__ are replaced with whatever
# the active theme resolves to, same placeholder convention as rofi's
# config.rasi and hyprland.conf's XCURSOR_THEME/HYPRCURSOR_THEME env lines.
Net/ThemeName "__GTK_THEME__"
Net/IconThemeName "__ICON_THEME__"
Gtk/CursorThemeName "__CURSOR_THEME__"
Net/EnableEventSounds 1
EnableInputFeedbackSounds 0
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintslight"
Xft/RGBA "rgb"
